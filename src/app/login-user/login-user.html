<div class="page active" id="page-login">
  <div class="page-sm">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="big-logo">🍊 GGYUL Market</div>
        <p>"Local secondhand deals, fresh as a tangerine.</p>
      </div>
      <div class="auth-form">
        <div class="form-group">
          <label class="label">E-mail</label>
          <input type="email" class="input-field" placeholder="example@email.com" [(ngModel)]="inputId">
        </div>
        <div class="form-group">
          <label class="label">Password</label>
          <input type="password" class="input-field" placeholder="enter your password" [(ngModel)]="inputPw">
        </div>
      </div>
      <div class="auth-actions" style="margin-top:20px;">
        <button class="btn-primary" style="width:100%;padding:14px;" (click)="doLogin()">Login</button>
        <div class="auth-divider">or</div>
        <button class="btn-secondary" style="width:100%;padding:14px;" [routerLink]="['/registerUser']">Sign up</button>
      </div>
    </div>
  </div>
</div>
