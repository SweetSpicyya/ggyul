<header class="header" id="main-header">
  <div class="header-inner">
    <a class="logo" href="#" [routerLink]="['/home']">
      <span>🍊</span> GGYUL
    </a>
    @if(loginYn && loginUser){
      <span class="header-greeting">Welcome, <strong id="greet-name">{{loginUser.first_name}}</strong></span>
    }
    <nav class="header-nav">
      <a class="nav-link" routerLinkActive="active" [routerLink]="['/home']">🏠 Home</a>
      <a class="nav-link" routerLinkActive="active" (click)="gotoRequiredPage('/viewMyProduct')">📦 My Products</a>
      <a class="nav-link" routerLinkActive="active" (click)="gotoRequiredPage('/myFavourites')">❤️ Favourite</a>
      <a class="nav-link" routerLinkActive="active" (click)="gotoRequiredPage('/profileUser')">👤 Profile</a>
      @if(loginYn && loginUser.admin == 'ADMIN'){
        <a class="nav-link admin-link" href="#" id="all-users-link" [routerLink]="['/allUser']">🛡 All User</a>
      }
      
      @if(loginYn){
        <button class="nav-btn-logout" (click)="doLogout()">Logout</button>
      } @else {
        <button class="nav-btn-logout" [routerLink]="['/loginUser']" >Login</button>
      }
    </nav>
  </div>
</header>
<router-outlet></router-outlet>
